stages:

  data_collection:
    cmd: python src/data_collection.py
    deps:
      - src/data_collection.py
      - params.yaml
    params:
      - data.dataset_url
      - data.raw_dir
      - data.classes
      - data.max_images_per_class
    outs:
      - data/raw

  data_processing:
    cmd: python src/data_processing.py
    deps:
      - src/data_processing.py
      - data/raw
      - params.yaml
    params:
      - processing.image_size
      - processing.validation_split
    outs:
      - data/processed/X_train.npy
      - data/processed/X_val.npy
      - data/processed/y_train.npy
      - data/processed/y_val.npy

  feature_selection:
    cmd: python src/feature_selection.py
    deps:
      - src/feature_selection.py
      - data/processed/X_train.npy
      - data/processed/X_val.npy
      - params.yaml
    params:
      - features.flatten
      - features.normalize
    outs:
      - data/processed/X_train_feat.npy
      - data/processed/X_val_feat.npy
      - data/processed/y_train_feat.npy
      - data/processed/y_val_feat.npy

  model_training:
    cmd: python src/model_training.py
    deps:
      - src/model_training.py
      - data/processed/X_train_feat.npy
      - params.yaml
    params:
      - training.n_estimators
      - training.max_depth
      - training.random_state
    outs:
      - data/model/model.pkl

  model_evaluation:
    cmd: python src/model_evaluation.py
    deps:
      - src/model_evaluation.py
      - data/model/model.pkl
      - data/processed/X_val_feat.npy
      - params.yaml
    metrics:
      - data/metrics.json:
          cache: false
    plots:
      - data/plots/confusion_matrix.png:
          cache: false
